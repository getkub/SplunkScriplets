<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Shopping Flow</title>

<style>
    html, body {
        margin: 0;
        min-height: 100%;
        background: #061522;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: auto;
        font-family: Arial, sans-serif;
    }

    svg {
        width: min(800px, 100vw);
        height: auto;
        display: block;
    }

    .node {
        cursor: pointer;
    }

    .node:hover {
        filter: brightness(1.15);
    }
</style>
</head>

<body>

<svg xmlns="http://www.w3.org/2000/svg"
     width="800"
     height="900"
     viewBox="0 0 800 900">

    <defs>

        <!-- Background -->
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#071b2d"/>
            <stop offset="55%" stop-color="#0b2b3d"/>
            <stop offset="100%" stop-color="#061522"/>
        </linearGradient>

        <!-- Christmas red -->
        <linearGradient id="christmasRed">
            <stop offset="0%" stop-color="#ff4b4b"/>
            <stop offset="100%" stop-color="#b5122c"/>
        </linearGradient>

        <!-- Christmas green -->
        <linearGradient id="christmasGreen">
            <stop offset="0%" stop-color="#43e97b"/>
            <stop offset="100%" stop-color="#11998e"/>
        </linearGradient>

        <!-- Shopping gold -->
        <linearGradient id="gold">
            <stop offset="0%" stop-color="#fff176"/>
            <stop offset="45%" stop-color="#ffd54f"/>
            <stop offset="100%" stop-color="#ff9800"/>
        </linearGradient>

        <!-- Purple decision -->
        <linearGradient id="purple">
            <stop offset="0%" stop-color="#b388ff"/>
            <stop offset="100%" stop-color="#6a1b9a"/>
        </linearGradient>

        <!-- Laptop green -->
        <linearGradient id="laptopGreen">
            <stop offset="0%" stop-color="#7CFF6B"/>
            <stop offset="100%" stop-color="#00a86b"/>
        </linearGradient>

        <!-- Phone yellow -->
        <linearGradient id="phoneYellow">
            <stop offset="0%" stop-color="#fff176"/>
            <stop offset="100%" stop-color="#ffb300"/>
        </linearGradient>

        <!-- Car red -->
        <linearGradient id="carRed">
            <stop offset="0%" stop-color="#ff6b6b"/>
            <stop offset="100%" stop-color="#d50000"/>
        </linearGradient>

        <!-- Green glow -->
        <filter id="glowGreen"
                x="-100%" y="-100%"
                width="300%" height="300%">
            <feGaussianBlur stdDeviation="5"
                            result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Gold glow -->
        <filter id="glowGold"
                x="-100%" y="-100%"
                width="300%" height="300%">
            <feGaussianBlur stdDeviation="5"
                            result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Red glow -->
        <filter id="glowRed"
                x="-100%" y="-100%"
                width="300%" height="300%">
            <feGaussianBlur stdDeviation="5"
                            result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Arrow -->
        <marker id="arrow"
                markerWidth="12"
                markerHeight="12"
                refX="10"
                refY="4"
                orient="auto">
            <path d="M0,0 L0,8 L11,4 Z"
                  fill="#9fb3c8"/>
        </marker>

    </defs>


    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <rect width="800"
          height="900"
          fill="url(#bg)"/>


    <!-- ================================================= -->
    <!-- SNOW -->
    <!-- ================================================= -->

    <g fill="white" opacity=".55">

        <circle cx="80" cy="80" r="3">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="9s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="180" cy="20" r="2">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="7s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="300" cy="120" r="3">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="11s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="470" cy="40" r="2">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="8s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="650" cy="100" r="3">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="10s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="730" cy="200" r="2">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="6s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="120" cy="350" r="2">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="8.5s"
                     repeatCount="indefinite"/>
        </circle>

        <circle cx="580" cy="300" r="2">
            <animate attributeName="cy"
                     from="-20"
                     to="920"
                     dur="9.5s"
                     repeatCount="indefinite"/>
        </circle>

    </g>


    <!-- ================================================= -->
    <!-- TITLE -->
    <!-- ================================================= -->

    <text x="400"
          y="55"
          text-anchor="middle"
          font-size="28"
          font-weight="bold"
          fill="#ffffff">
        🎄 Christmas Shopping
    </text>

    <text x="400"
          y="82"
          text-anchor="middle"
          font-size="14"
          fill="#b9d5e8">
        Follow the flow...
    </text>


    <!-- ================================================= -->
    <!-- FLOW PATHS -->
    <!-- ================================================= -->

    <g fill="none"
       stroke="#71869b"
       stroke-width="3"
       stroke-linecap="round"
       marker-end="url(#arrow)">

        <!-- Christmas → Shopping -->
        <path id="path1"
              d="M400 190 L400 285"/>

        <!-- Shopping → Think -->
        <path id="path2"
              d="M400 355 L400 450"/>

        <!-- Think → Laptop -->
        <path id="path3"
              d="M360 510
                 C300 560 190 590 160 670"/>

        <!-- Think → Phone -->
        <path id="path4"
              d="M400 520 L400 670"/>

        <!-- Think → Car -->
        <path id="path5"
              d="M440 510
                 C500 560 610 590 640 670"/>

    </g>


    <!-- ================================================= -->
    <!-- FLOWING PARTICLES -->
    <!-- ================================================= -->

    <g>

        <!-- ============================================= -->
        <!-- MONEY FLOW -->
        <!-- ============================================= -->

        <circle r="8"
                fill="#ffd740"
                filter="url(#glowGold)">

            <animateMotion dur="1.7s"
                           repeatCount="indefinite">
                <mpath href="#path1"/>
            </animateMotion>

        </circle>

        <circle r="5"
                fill="#fff176">

            <animateMotion dur="1.7s"
                           begin=".55s"
                           repeatCount="indefinite">
                <mpath href="#path1"/>
            </animateMotion>

        </circle>

        <circle r="3"
                fill="#fffde7">

            <animateMotion dur="1.7s"
                           begin="1.1s"
                           repeatCount="indefinite">
                <mpath href="#path1"/>
            </animateMotion>

        </circle>


        <!-- ============================================= -->
        <!-- SHOPPING FLOW -->
        <!-- ============================================= -->

        <circle r="8"
                fill="#ffca28"
                filter="url(#glowGold)">

            <animateMotion dur="1.5s"
                           repeatCount="indefinite">
                <mpath href="#path2"/>
            </animateMotion>

        </circle>

        <circle r="5"
                fill="#fff59d">

            <animateMotion dur="1.5s"
                           begin=".45s"
                           repeatCount="indefinite">
                <mpath href="#path2"/>
            </animateMotion>

        </circle>

        <circle r="3"
                fill="#fffde7">

            <animateMotion dur="1.5s"
                           begin=".9s"
                           repeatCount="indefinite">
                <mpath href="#path2"/>
            </animateMotion>

        </circle>


        <!-- ============================================= -->
        <!-- LAPTOP GREEN FLOW -->
        <!-- ============================================= -->

        <circle r="9"
                fill="#39ff88"
                filter="url(#glowGreen)">

            <animateMotion dur="1.8s"
                           repeatCount="indefinite">
                <mpath href="#path3"/>
            </animateMotion>

        </circle>

        <circle r="6"
                fill="#8affb7">

            <animateMotion dur="1.8s"
                           begin=".6s"
                           repeatCount="indefinite">
                <mpath href="#path3"/>
            </animateMotion>

        </circle>

        <circle r="3"
                fill="#d9ffe8">

            <animateMotion dur="1.8s"
                           begin="1.2s"
                           repeatCount="indefinite">
                <mpath href="#path3"/>
            </animateMotion>

        </circle>


        <!-- ============================================= -->
        <!-- IPHONE YELLOW FLOW -->
        <!-- ============================================= -->

        <circle r="9"
                fill="#ffe600"
                filter="url(#glowGold)">

            <animateMotion dur="1.6s"
                           repeatCount="indefinite">
                <mpath href="#path4"/>
            </animateMotion>

        </circle>

        <circle r="6"
                fill="#fff176">

            <animateMotion dur="1.6s"
                           begin=".5s"
                           repeatCount="indefinite">
                <mpath href="#path4"/>
            </animateMotion>

        </circle>

        <circle r="3"
                fill="#fffde7">

            <animateMotion dur="1.6s"
                           begin="1s"
                           repeatCount="indefinite">
                <mpath href="#path4"/>
            </animateMotion>

        </circle>


        <!-- ============================================= -->
        <!-- CAR RED FLOW -->
        <!-- ============================================= -->

        <circle r="9"
                fill="#ff3b30"
                filter="url(#glowRed)">

            <animateMotion dur="1.9s"
                           repeatCount="indefinite">
                <mpath href="#path5"/>
            </animateMotion>

        </circle>

        <circle r="6"
                fill="#ff7770">

            <animateMotion dur="1.9s"
                           begin=".65s"
                           repeatCount="indefinite">
                <mpath href="#path5"/>
            </animateMotion>

        </circle>

        <circle r="3"
                fill="#ffd0cd">

            <animateMotion dur="1.9s"
                           begin="1.3s"
                           repeatCount="indefinite">
                <mpath href="#path5"/>
            </animateMotion>

        </circle>

    </g>


    <!-- ================================================= -->
    <!-- CHRISTMAS NODE -->
    <!-- ================================================= -->

    <g class="node">

        <rect x="270"
              y="115"
              width="260"
              height="75"
              rx="20"
              fill="url(#christmasRed)"
              stroke="#ffdfdf"
              stroke-width="2"
              filter="url(#glowRed)">

            <animate attributeName="opacity"
                     values="1;.88;1"
                     dur="2s"
                     repeatCount="indefinite"/>

        </rect>

        <text x="400"
              y="155"
              text-anchor="middle"
              font-size="25"
              font-weight="bold"
              fill="white">
            🎄 Christmas
        </text>

        <text x="400"
              y="177"
              text-anchor="middle"
              font-size="12"
              fill="#ffeaea">
            Get money
        </text>

    </g>


    <!-- ================================================= -->
    <!-- SHOPPING NODE -->
    <!-- ================================================= -->

    <g class="node">

        <rect x="260"
              y="285"
              width="280"
              height="70"
              rx="18"
              fill="url(#gold)"
              stroke="#fff4b0"
              stroke-width="2"
              filter="url(#glowGold)"/>

        <text x="400"
              y="327"
              text-anchor="middle"
              font-size="24"
              font-weight="bold"
              fill="#593b00">
            🛒 Go shopping
        </text>

    </g>


    <!-- ================================================= -->
    <!-- THINK NODE -->
    <!-- ================================================= -->

    <g class="node">

        <polygon points="400,450
                         485,490
                         400,530
                         315,490"
                 fill="url(#purple)"
                 stroke="#d7b8ff"
                 stroke-width="2"/>

        <text x="400"
              y="496"
              text-anchor="middle"
              font-size="18"
              font-weight="bold"
              fill="white">
            🤔 Think
        </text>

    </g>


    <!-- ================================================= -->
    <!-- LAPTOP -->
    <!-- ================================================= -->

    <g class="node">

        <rect x="70"
              y="670"
              width="180"
              height="90"
              rx="18"
              fill="url(#laptopGreen)"
              filter="url(#glowGreen)"/>

        <text x="160"
              y="715"
              text-anchor="middle"
              font-size="24"
              font-weight="bold"
              fill="#06351f">
            💻 Laptop
        </text>

        <text x="160"
              y="740"
              text-anchor="middle"
              font-size="13"
              fill="#073e26">
            OPTION ONE
        </text>

    </g>


    <!-- ================================================= -->
    <!-- IPHONE -->
    <!-- ================================================= -->

    <g class="node">

        <rect x="310"
              y="670"
              width="180"
              height="90"
              rx="18"
              fill="url(#phoneYellow)"
              filter="url(#glowGold)"/>

        <text x="400"
              y="715"
              text-anchor="middle"
              font-size="24"
              font-weight="bold"
              fill="#5c4300">
            📱 iPhone
        </text>

        <text x="400"
              y="740"
              text-anchor="middle"
              font-size="13"
              fill="#6b5000">
            OPTION TWO
        </text>

    </g>


    <!-- ================================================= -->
    <!-- CAR -->
    <!-- ================================================= -->

    <g class="node">

        <rect x="550"
              y="670"
              width="180"
              height="90"
              rx="18"
              fill="url(#carRed)"
              filter="url(#glowRed)"/>

        <text x="640"
              y="715"
              text-anchor="middle"
              font-size="24"
              font-weight="bold"
              fill="white">
            🚗 Car
        </text>

        <text x="640"
              y="740"
              text-anchor="middle"
              font-size="13"
              fill="#ffe4e4">
            OPTION THREE
        </text>

    </g>


    <!-- ================================================= -->
    <!-- EDGE LABELS -->
    <!-- ================================================= -->

    <g font-size="13"
       font-weight="bold">

        <rect x="415"
              y="215"
              width="90"
              height="26"
              rx="13"
              fill="#15384d"/>

        <text x="460"
              y="233"
              text-anchor="middle"
              fill="#ffd740">
            Get money
        </text>


        <rect x="415"
              y="385"
              width="90"
              height="26"
              rx="13"
              fill="#15384d"/>

        <text x="460"
              y="403"
              text-anchor="middle"
              fill="#ffd740">
            Shopping
        </text>


        <text x="215"
              y="595"
              fill="#5cff9a">
            ONE
        </text>

        <text x="420"
              y="590"
              fill="#ffe600">
            TWO
        </text>

        <text x="565"
              y="595"
              fill="#ff6565">
            THREE
        </text>

    </g>


    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <text x="400"
          y="835"
          text-anchor="middle"
          font-size="14"
          fill="#89a9bd">
        ✨ Choose your Christmas present ✨
    </text>

</svg>

</body>
</html>
